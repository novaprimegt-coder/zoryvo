name: Deploy ZORYVO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rebuild verified ZORYVO site
        shell: bash
        run: |
          mkdir -p site
          cat parts/p*.txt > app.b64
          base64 -d app.b64 > app.html.gz
          echo "0abac3f947fc222874463821a8a3f7981b83b60441715aa20c4bd7e058fc16ab  app.html.gz" | sha256sum -c -
          gunzip -c app.html.gz > site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
