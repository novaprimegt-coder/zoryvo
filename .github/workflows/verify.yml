name: Verify ZORYVO build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rebuild and verify ZORYVO
        shell: bash
        run: |
          cat parts/p*.txt > app.b64
          base64 -d app.b64 > app.html.gz
          echo "0abac3f947fc222874463821a8a3f7981b83b60441715aa20c4bd7e058fc16ab  app.html.gz" | sha256sum -c -
          gunzip -c app.html.gz > index.html
          test -s index.html
          grep -q "ZORYVO" index.html
          grep -q "const APP_VERSION='4.0.3'" index.html
          echo "ZORYVO build verified successfully"
