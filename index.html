<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>ZORYVO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070b;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh;display:grid;place-items:center}.boot{width:min(88vw,420px);text-align:center;padding:28px}.mark{width:70px;height:70px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#10d8ff,#436fff);box-shadow:0 0 55px #19d8ff33;font-weight:1000;font-size:26px;color:#031017}.name{font-size:24px;font-weight:900;letter-spacing:.08em}.sub{margin-top:8px;color:#8fa0b5;font-size:13px;line-height:1.5}.bar{height:5px;margin-top:22px;border-radius:99px;overflow:hidden;background:#13202f}.bar i{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#19d8ff,#62eaff);animation:move 1.05s ease-in-out infinite}.error{display:none;margin-top:18px;padding:14px;border:1px solid #56303b;background:#1b0f14;border-radius:16px;color:#ffc0cb;font-size:12px;line-height:1.5}.retry{display:none;margin:14px auto 0;border:0;border-radius:13px;padding:11px 18px;font:inherit;font-weight:800;background:#19d8ff;color:#031017;cursor:pointer}@keyframes move{0%{transform:translateX(-110%)}50%{transform:translateX(150%)}100%{transform:translateX(330%)}}
</style>
</head>
<body>
<main class="boot" id="boot">
  <div class="mark">Z</div>
  <div class="name">ZORYVO</div>
  <div class="sub" id="status">Preparando tu experiencia…</div>
  <div class="bar" id="bar"><i></i></div>
  <div class="error" id="error"></div>
  <button class="retry" id="retry" type="button">Reintentar</button>
</main>
<script>
(()=>{
'use strict';
const PART_COUNT=14;
const status=document.getElementById('status');
const bar=document.getElementById('bar');
const error=document.getElementById('error');
const retry=document.getElementById('retry');
const paths=Array.from({length:PART_COUNT},(_,i)=>`parts/p${String(i).padStart(2,'0')}.txt`);
function fromBase64(s){
  const raw=atob(s.replace(/\s+/g,''));
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
async function gunzipNative(bytes){
  if(typeof DecompressionStream!=='function')throw new Error('NO_NATIVE_GZIP');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
async function gunzipFallback(bytes){
  if(!globalThis.fflate){
    await new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
      s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar el descompresor de compatibilidad'));
      document.head.appendChild(s);
    });
  }
  return new TextDecoder().decode(globalThis.fflate.gunzipSync(bytes));
}
async function boot(){
  error.style.display='none';retry.style.display='none';bar.style.display='block';
  status.textContent='Cargando ZORYVO…';
  try{
    const responses=await Promise.all(paths.map(p=>fetch(p,{cache:'no-cache'})));
    responses.forEach((r,i)=>{if(!r.ok)throw new Error(`No se pudo cargar ${paths[i]} (${r.status})`)});
    const chunks=await Promise.all(responses.map(r=>r.text()));
    status.textContent='Verificando la aplicación…';
    const bytes=fromBase64(chunks.join(''));
    let html;
    try{html=await gunzipNative(bytes)}catch(e){html=await gunzipFallback(bytes)}
    if(!html.includes('<!doctype html>')&&!html.includes('<!DOCTYPE html>'))throw new Error('El documento reconstruido no es HTML válido');
    if(!html.includes('ZORYVO')||!html.includes("const APP_VERSION='4.0.3'"))throw new Error('La versión publicada no coincide con ZORYVO V4.0.3');
    status.textContent='Abriendo ZORYVO…';
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);bar.style.display='none';status.textContent='No se pudo iniciar ZORYVO';
    error.textContent='La aplicación no pudo cargarse correctamente. Comprueba tu conexión y vuelve a intentarlo.';
    error.style.display='block';retry.style.display='block';
  }
}
retry.addEventListener('click',boot);
boot();
})();
</script>
</body>
</html>
